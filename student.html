<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student</title>
</head>

<body>

    <h1>Student Information</h1>

    <p>Firstname: {{ student['firstname'] }}</p>
    <p>Lastname: {{ student['lastname'] }}</p>
    <p>DOB: {{ student['dob'] }}</p>

    <h2>Marks</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Subject</th>
                <th>Mark</th>
            </tr>
        </thead>

        <tbody>
            {% for result in marks %}
            <tr>
                <td>{{ result['subject'] }}</td>
                <td>{{ result['mark'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
